name: Deploy mdBook site to Pages

on:
  push:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: Fetch GitHub repositories
        run: python3 portfolio/github_repos.py

      - name: Run json-to-md.py
        run: python3 portfolio/json-to-md.py

      - name: Upload md
        uses: actions/upload-artifact@v7
        with:
          name: md-files
          path: |
            portfolio/src/index.md
            portfolio/src/projects.md
          

  build-book:
    runs-on: ubuntu-latest
    needs: build-md
    steps:
      - uses: actions/checkout@v7

      - name: Download MD files
        uses: actions/download-artifact@v8
        with:
          name: md-files
          path: portfolio/src/

      - name: Install mdBook
        run: cargo install mdbook

      - name: Build with mdBook
        run: mdbook build portfolio

      - name: Upload artifact (explicit name)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./portfolio/book
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-book
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Print deployment outputs (debug)
        run: |
          echo "deployment page_url: ${{ steps.deployment.outputs.page_url }}"
          if [ -z "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "WARNING: page_url is empty — check Pages settings, environment protections, or action logs."
          fi
